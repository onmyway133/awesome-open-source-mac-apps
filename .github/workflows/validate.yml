name: validate

# Runs on pull requests (including from forks) and on pushes to main. Keep it to these two
# triggers: no manual, API-dispatched, reusable or "target" PR triggers, so nobody can start a
# run by hand and PR code never runs with secrets or a write token. The token is read-only and
# only used to look up stars on GitHub.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the PR's changed apps can be told apart from the existing ones.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # New and edited apps must meet the star bar; existing ones only warn.
      - if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --changed-since "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name == 'push'
        run: node scripts/validate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
